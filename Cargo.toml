[package]
name = "mica"
version = "0.1.0"
edition = "2024"
description = "A fast, terminal-native IDE"
license = "MIT"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.3.19", features = ["derive"] }
crossterm = "0.28.1"
ignore = "0.4.27"
notify = "7.0.0"
nucleo-matcher = "0.3.1"
ratatui = "0.29.0"
ropey = "1.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "1.0.69"
toml = "0.8.23"
tracing = "0.1.44"
tree-sitter = "0.24.7"
tree-sitter-rust = "0.23.3"
streaming-iterator = "0.1.9"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
